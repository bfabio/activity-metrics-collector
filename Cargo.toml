[package]
name = "activity-metrics-collector"
version = "0.1.0"
edition = "2021"
description = "Collects git forges metrics into the software-catalog-api analysis field"
repository = "https://github.com/bfabio/activity-metrics-collector"
license = "AGPL-3.0-only"
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
time = { version = "0.3", features = ["macros", "parsing", "formatting"] }
anyhow = "1"
futures = "0.3"
async-trait = "0.1"
url = "2"
tempfile = "3"
dotenvy = "0.15"
